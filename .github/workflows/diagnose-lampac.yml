name: Diagnose Lampac image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Lampac image
        shell: bash
        run: |
          set -e

          echo "=== Stored digest ==="
          cat .lampac-digest 2>/dev/null || echo "No .lampac-digest"

          echo
          echo "=== Current manifest ==="
          docker buildx imagetools inspect \
            ghcr.io/lampac-nextgen/lampac:latest

          echo
          echo "=== Current manifest digest ==="
          docker buildx imagetools inspect \
            ghcr.io/lampac-nextgen/lampac:latest \
            --format '{{json .Manifest.Digest}}'

          echo
          echo "=== OCI labels / annotations ==="
          docker buildx imagetools inspect \
            ghcr.io/lampac-nextgen/lampac:latest \
            --format '{{json .}}'